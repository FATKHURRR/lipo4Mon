<body class="min-h-screen flex flex-col">
<header class="sticky top-0 z-40 shadow-lg w-full">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center">
      <div class="bg-white/20 p-2 rounded-lg mr-3"><i class="fas fa-car-battery text-2xl"></i></div>
      <h1 class="text-xl sm:text-2xl font-bold">Modul Sakti</h1>
    </div>
  </div>
</header>

<main class="flex-1 p-4 sm:p-6 w-full">
  <div class="max-w-7xl mx-auto">
    <div id="batteryTableWrapper" class="bms-table-wrapper rounded-xl shadow-sm overflow-hidden">
      <table class="bms-table">
        <thead><tr><th>Battery</th><th>Voltage</th><th>Current</th><th>Power</th><th>SOC</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="empty-state" class="hidden text-center py-12 rounded-xl shadow-sm mt-5" style="background-color:var(--card-lapis);">
      <h3 class="text-lg font-medium mb-2">No batteries connected</h3>
    </div>
  </div>
</main>

<div id="validationModal" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="rounded-xl shadow-2xl max-w-md w-full p-6 text-center" style="background-color:var(--card-lapis);color:var(--card-text);border:2px solid #ef4444;">
    <div class="text-red-500 mb-3"><i class="fas fa-triangle-exclamation text-5xl"></i></div>
    <h3 class="text-xl font-bold mb-2">ID Modul Tidak Terdaftar</h3>
    <p class="text-sm mb-6" style="color:var(--card-subtext);">ID Modul yang Anda masukkan tidak terdaftar di sistem otorisasi kami.</p>
    <a href="https://wa.me/628972309993?text=saya%20tertarik%20untuk%20memesan%20modulsakti" target="_blank" class="block w-full py-3 px-4 rounded-xl text-white font-bold bg-green-600 hover:bg-green-700 transition shadow-lg flex items-center justify-center gap-2">
      <i class="fab fa-whatsapp text-xl"></i> Pesan Modul Sakti Sekarang
    </a>
  </div>
</div>
