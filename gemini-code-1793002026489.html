      </div>
    </div>
    
    <div id="viewToggleBar" class="view-toggle-bar hidden">
      <div id="viewToggle" class="view-toggle" role="group">

    </div>

      </div>
    </div>
    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 hidden"></div>
    <div id="empty-state" class="hidden text-center py-12 rounded-xl shadow-sm mt-5" style="background-color:var(--card-lapis);">
      <div class="text-blue-500 mb-4"><i class="fas fa-car-battery text-5xl opacity-50"></i></div>
      <h3 class="text-lg font-medium mb-2">No batteries connected</h3>
    </div>
  </div>
</main>

  </div>
</div>
